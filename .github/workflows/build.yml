name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Localizar projeto (aceita ZIP na raiz)
        id: proj
        run: |
          ZIP=$(ls ./*.zip 2>/dev/null | head -n1 || true)
          if [ ! -f settings.gradle.kts ] && [ -n "$ZIP" ]; then
            echo "Extraindo $ZIP"
            unzip -oq "$ZIP" -d _proj
          fi
          S=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1)
          if [ -z "$S" ]; then
            echo "ERRO: settings.gradle.kts nao encontrado. Envie o TVBoxOS_v7.zip para a raiz do repositorio."
            ls -la
            exit 1
          fi
          D=$(dirname "$S")
          echo "Projeto em: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK (debug)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Enviar relatórios se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-erro
          path: ${{ steps.proj.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
